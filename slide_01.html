<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROJECT SUTRA — Title Slide</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            earth: {
              forest: '#183A2B',
              terracotta: '#9E4D34',
              sage: '#4A7A58',
            },
            sandstone: {
              muted: '#5A6B63',
              border: '#EDE4D6',
            }
          }
        }
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: #EFE8DE;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .slide-canvas {
      width: 1920px;
      height: 1080px;
      background-color: #FAF7F2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 100px 120px;
      box-shadow: 0 25px 60px rgba(24, 58, 43, 0.08);
      position: relative;
    }
  </style>
</head>
<body>

  <div class="slide-canvas text-earth-forest">
    
    <!-- Top Left Logo / Organization Tag -->
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-earth-forest flex items-center justify-center text-white font-mono font-bold text-sm shadow-sm">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2">
          <polygon points="12 2 2 7 12 12 22 7 12 2" />
          <polyline points="2 17 12 22 22 17" />
          <polyline points="2 12 12 17 22 12" />
        </svg>
      </div>
      <span class="font-mono text-xs font-bold tracking-widest uppercase text-sandstone-muted">
        DEFENSE &amp; DISASTER ROBOTICS
      </span>
    </div>

    <!-- Center Formula: [Context] -> [Accent Line] -> [Main Title] -> [Subtitle] -->
    <div class="max-w-4xl space-y-7 my-auto">
      
      <!-- 1. Context Tagline (small, muted) -->
      <div class="font-mono text-base font-bold tracking-widest uppercase text-earth-terracotta">
        AUTONOMOUS MULTI-UAV SWARM ARCHITECTURE
      </div>

      <!-- 2. Accent Line -->
      <div class="w-24 h-[3px] bg-earth-terracotta rounded-full"></div>

      <!-- 3. Main Title (Big, bold, dark — largest element) -->
      <h1 class="font-heading text-8xl font-black tracking-tight text-earth-forest uppercase leading-none">
        PROJECT SUTRA
      </h1>

      <!-- 4. Subtitle (18-22pt, muted) -->
      <p class="text-2xl text-sandstone-muted font-medium max-w-2xl leading-relaxed">
        Swarm Unified Tactical Reconnaissance Architecture for GPS-Denied and Jammed Mountain Environments.
      </p>

    </div>

    <!-- Bottom Bar: [Author | Date] -->
    <div class="pt-8 border-t border-sandstone-border flex justify-between items-center font-mono text-sm text-sandstone-muted">
      <div>
        <span class="font-bold text-earth-forest text-base">Nikhil Sai Kilani</span>
        <span class="mx-3 text-sandstone-border">•</span>
        <span>Lead Architect</span>
      </div>

      <div class="font-semibold text-earth-forest">
        August 2026
      </div>
    </div>

  </div>

</body>
</html>
